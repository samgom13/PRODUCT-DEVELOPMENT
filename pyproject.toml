[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "predict_future_sales"
version = "0.0.1"
description = "An\u00e1lisis exploratorio de ventas para pron\u00f3stico mensual por tienda y producto."
authors = [
  { name = "Luis Zarate" },
  { name = "Samuel Gómez" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",

]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["predict_future_sales"]
include = ["pyproject.toml", "predict_future_sales/**/*.py"]
extend-exclude = [".pixi"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["predict_future_sales"]
force-sort-within-sections = true
